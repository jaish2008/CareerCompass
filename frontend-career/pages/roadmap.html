<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerCompass — Project Roadmap</title>

    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/roadmap.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="dashboard-container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="sidebar-logo">
                <span>🧭</span>
                <h2>CareerCompass</h2>
            </div>

            <nav class="sidebar-menu">
                <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
                <a href="assessment.html"><i class="fa-solid fa-bullseye"></i> Career Assessment</a>
                <a href="resume.html"><i class="fa-solid fa-file-lines"></i> Resume Builder</a>
                <a href="github.html"><i class="fa-brands fa-github"></i> GitHub Analyzer</a>
                <a href="interview.html"><i class="fa-solid fa-microphone"></i> Interview Prep</a>
                <a href="roadmap.html" class="active"><i class="fa-solid fa-road"></i> Project Roadmap</a>
                <a href="planner.html"><i class="fa-solid fa-calendar-days"></i> Learning Planner</a>
                <a href="#"><i class="fa-solid fa-briefcase"></i> Internship Tracker</a>
                <a href="#"><i class="fa-solid fa-gear"></i> Settings</a>
            </nav>

        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Top Navigation -->
            <header class="topbar">
                <div class="welcome">
                    <h1>Project Roadmap 🧭</h1>
                    <p>Development plan, scope and milestones for CareerCompass.</p>
                </div>

                <div class="topbar-actions">
                    <button class="notification-btn">🔔</button>
                    <div class="profile">👤</div>
                </div>
            </header>

            <!-- Scope Banner (rendered from roadmapData.scope) -->
            <section class="scope-banner" id="scope-banner">
                <!-- filled by roadmap.js -->
            </section>

            <!-- Milestone Stats (derived from roadmapData.timeline / team) -->
            <section class="stats" id="stats">
                <!-- filled by roadmap.js -->
            </section>

            <!-- Team Split -->
            <section class="team-section">
                <h2 class="section-heading">Team &amp; Ownership</h2>
                <div class="team-grid" id="team-grid">
                    <!-- filled by roadmap.js -->
                </div>
            </section>

            <!-- Timeline -->
            <section class="timeline-section">
                <h2 class="section-heading">Development Timeline</h2>
                <div class="timeline" id="timeline">
                    <!-- filled by roadmap.js -->
                </div>
            </section>

            <!-- Future Scope -->
            <section class="recommendations">
                <h2>🚀 Future Scope</h2>
                <div class="recommendation-grid" id="recommendation-grid">
                    <!-- filled by roadmap.js -->
                </div>
            </section>

        </main>

    </div>

    <script src="../js/roadmap-data.js"></script>
    <script src="../js/roadmap.js"></script>
</body>
</html>
