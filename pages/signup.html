<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up | CareerCompass</title>

<link rel="stylesheet" href="../css/login.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="login-container">

<div class="login-card">

<div class="login-header">

<span class="logo">🧭</span>

<h1>CareerCompass</h1>

<p>Create Your Account</p>

</div>

<form id="signupForm">

<div class="input-group">

<label>Full Name</label>

<input
    type="text"
    id="signupName"
    name="name"
    placeholder="Enter your name"
    autocomplete="name"
    maxlength="100"
    required>

</div>

<div class="input-group">

<label>Email</label>

<input
    type="email"
    id="signupEmail"
    name="email"
    placeholder="Enter your email"
    autocomplete="email"
    maxlength="255"
    required>

</div>

<div class="input-group">

<label>Password</label>

<div class="password-box">

<input
    type="password"
    id="password"
    name="password"
    placeholder="Create password"
    autocomplete="new-password"
    minlength="8"
    maxlength="128"
    required>

<i class="fa-solid fa-eye" id="togglePassword"></i>

</div>

</div>

<div class="input-group">

    <label for="signupEducation">Education</label>

    <input
        type="text"
        id="signupEducation"
        name="education"
        placeholder="Example: Diploma"
        maxlength="100">

</div>

<div class="input-group">

    <label for="signupCourse">Course / Branch</label>

    <input
        type="text"
        id="signupCourse"
        name="course"
        placeholder="Example: Computer Science"
        maxlength="100">

</div>

<div class="input-group">

    <label for="signupSemester">Semester / Year</label>

    <input
        type="text"
        id="signupSemester"
        name="semester"
        placeholder="Example: 5"
        maxlength="50">

</div>

<p
    id="authMessage"
    class="auth-message"
    role="alert"
    aria-live="polite">
</p>

<button type="submit" id="signupButton" >

Create Account

</button>

</form>

<p class="signup-link">

Already have an account?

<a href="login.html">

Login

</a>

</p>

</div>

</div>

<script src="../js/auth.js"></script>

</body>

</html>
