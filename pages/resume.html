<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resume Builder | CareerCompass</title>

    <link rel="stylesheet" href="../css/resume.css">

</head>

<body>

    <header class="resume-header">

    <h1>🧭 CareerCompass Resume Builder</h1>

    <p>Create a professional ATS-friendly resume</p>

</header>

<div class="container">

    <!-- Left Side -->

    <div class="resume-form">

        <h2>Resume Builder</h2>
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name">

        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email">

        <label>Phone Number</label>
        <input type="text" id="phone" placeholder="Enter your phone number">

        <label>Career Objective</label>
        <textarea id="objective" ></textarea>

        <label>Skills</label>
        <textarea id="skills" placeholder="Enter your skills"></textarea>

        <div class="button-group">

            <h3>Education</h3>

<label>Degree</label>
<input type="text" id="degree" placeholder="Diploma / B.Tech / BCA">

<label>College</label>
<input type="text" id="college" placeholder="College Name">

<label>Passing Year</label>
<input type="text" id="year" placeholder="2028">

<label>CGPA / Percentage</label>
<input type="text" id="cgpa" placeholder="8.5 CGPA">

    <button type="button" class="save-btn">
        Save Resume
    </button>

    <button type="reset" class="reset-btn">
        Reset
    </button>

</div>

    </div>

    <!-- Right Side -->

    <div class="resume-preview">

        <h1 id="previewName">Your Name</h1>

        <p 📧 <span id="previewEmail">Email</span></p>

        <p 📱<span id="previewPhone">Phone</span></p>

        <div class="divider"></div>

        <h3>Career Objective</h3>

        <p id="previewObjective"></p>

        <h3>Skills</h3>

        <p id="previewSkills"></p>

        <h3>Education</h3>

<p><strong>Degree:</strong> <span id="previewDegree"></span></p>

<p><strong>College:</strong> <span id="previewCollege"></span></p>

<p><strong>Year:</strong> <span id="previewYear"></span></p>

<p><strong>CGPA:</strong> <span id="previewCGPA"></span></p>

    </div>

</div>

<script src="../js/resume.js"></script>

</body>

</html>
